# Theme matches armoredpawn.github.io/About: always-dark deep navy,
# indigo and pink accents, Inter font, soft rounded cards.
[theme]
base = "dark"
primaryColor = "#8f95ff"
backgroundColor = "#07090f"
secondaryBackgroundColor = "#10141f"
textColor = "#eceef5"
borderColor = "#1f2535"
dataframeBorderColor = "#1f2535"
dataframeHeaderBackgroundColor = "#151a28"
linkColor = "#8f95ff"
codeBackgroundColor = "#151a28"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
headingFontWeights = [700, 700, 700, 600, 600, 600]
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
paddingTop = "2.5rem"
chartCategoricalColors = ["#6f75ee", "#d9579a", "#c98500", "#199e70", "#3987e5", "#0ca30c", "#a066d6", "#e66767"]
blueColor = "#8f95ff"
violetColor = "#a78bfa"
greenColor = "#34d399"
redColor = "#fb7185"
orangeColor = "#fb923c"
yellowColor = "#fbbf24"

[client]
toolbarMode = "viewer"
showErrorDetails = "type"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
