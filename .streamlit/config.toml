[theme]
font = "sans-serif"
baseRadius = "medium"
showWidgetBorder = true
paddingTop = "2.5rem"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#1c5cab"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#141413"
secondaryBackgroundColor = "#1f1f1d"
textColor = "#f0efec"
borderColor = "#2c2c2a"
linkColor = "#86b6ef"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"]

[client]
toolbarMode = "viewer"
showErrorDetails = "type"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
